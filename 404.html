<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#050506">
  <title>kxz0tn</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #050506;
      --panel: #0b0b0d;
      --line: #2a2a2e;
      --text: #e8e8ea;
      --dim: #8a8a90;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      min-height: 100svh;
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 16px;
      line-height: 1.45;
    }
    body {
      min-height: 100dvh;
      padding: max(8px, env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
    }
    #hud {
      position: relative;
      min-height: calc(100dvh - 16px);
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 28px 20px;
    }
    .c {
      position: absolute;
      width: 14px;
      height: 14px;
      pointer-events: none;
    }
    .c-tl { top: -1px; left: -1px; border-top: 1px solid var(--text); border-left: 1px solid var(--text); }
    .c-tr { top: -1px; right: -1px; border-top: 1px solid var(--text); border-right: 1px solid var(--text); }
    .c-bl { bottom: -1px; left: -1px; border-bottom: 1px solid var(--text); border-left: 1px solid var(--text); }
    .c-br { bottom: -1px; right: -1px; border-bottom: 1px solid var(--text); border-right: 1px solid var(--text); }
    .name {
      letter-spacing: 0.42em;
      text-shadow: 0 0 12px rgba(232, 232, 234, 0.28);
    }
    .code { margin: 1.2em 0 0.35em; }
    .msg { color: var(--dim); }
    a {
      color: inherit;
      text-underline-offset: 2px;
    }
    a:focus {
      outline: 1px solid var(--text);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="c c-tl"></div>
    <div class="c c-tr"></div>
    <div class="c c-bl"></div>
    <div class="c c-br"></div>
    <div class="name">KXZ0TN</div>
    <div class="code">404</div>
    <div class="msg">no such path</div>
    <p><a href="./index.html">https://kxz0tn.github.io</a></p>
  </div>
</body>
</html>
