<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#050506">
  <meta name="description" content="kxz0tn terminal">
  <title>kxz0tn</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23050506'/%3E%3Cpath fill='none' stroke='%23e8e8ea' stroke-width='1' d='M2 5V2h3M11 2h3v3M14 11v3h-3M5 14H2v-3'/%3E%3Crect x='7' y='7' width='2' height='2' fill='%23e8e8ea'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #050506;
      --panel: #0b0b0d;
      --line: #2a2a2e;
      --text: #e8e8ea;
      --dim: #8a8a90;
      --mute: #4a4a50;
      --error: #9a9a9a;
      --font: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      overscroll-behavior: none;
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.45;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    #app {
      position: fixed;
      inset: 0;
      height: 100%;
      height: 100svh;
      height: 100dvh;
      padding: max(8px, env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse at center, transparent 42%, rgba(0, 0, 0, 0.55) 100%),
        repeating-linear-gradient(0deg, transparent 0 19px, rgba(232, 232, 234, 0.028) 19px 20px),
        repeating-linear-gradient(90deg, transparent 0 19px, rgba(232, 232, 234, 0.028) 19px 20px);
      overflow: hidden;
    }

    #hud {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      background-color: var(--panel);
      background-image:
        repeating-linear-gradient(0deg, transparent 0 23px, rgba(232, 232, 234, 0.018) 23px 24px),
        repeating-linear-gradient(90deg, transparent 0 23px, rgba(232, 232, 234, 0.018) 23px 24px);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .scan {
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: 4;
      opacity: 0.045;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0 2px,
        #000 2px 3px
      );
    }

    .c {
      position: absolute;
      width: 14px;
      height: 14px;
      z-index: 6;
      pointer-events: none;
    }
    .c-tl { top: -1px; left: -1px; border-top: 1px solid var(--text); border-left: 1px solid var(--text); }
    .c-tr { top: -1px; right: -1px; border-top: 1px solid var(--text); border-right: 1px solid var(--text); }
    .c-bl { bottom: -1px; left: -1px; border-bottom: 1px solid var(--text); border-left: 1px solid var(--text); }
    .c-br { bottom: -1px; right: -1px; border-bottom: 1px solid var(--text); border-right: 1px solid var(--text); }

    #stat {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 7px 12px 6px;
      border-bottom: 1px solid var(--line);
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      min-height: 28px;
    }
    #stat span { white-space: nowrap; }
    #clk {
      color: var(--text);
      letter-spacing: 0.08em;
      font-variant-numeric: tabular-nums;
    }
    @media (max-width: 520px) {
      .opt { display: none; }
      #stat { letter-spacing: 0.1em; font-size: 10px; padding: 6px 10px; }
    }

    #stream {
      flex: 1 1 auto;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 12px 14px 18px;
      scrollbar-color: var(--mute) var(--panel);
    }

    #log { min-width: 0; }

    .mark {
      margin: 2px 0 14px;
      padding: 14px 10px 16px;
      position: relative;
      background:
        linear-gradient(var(--text), var(--text)) top left / 12px 1px no-repeat,
        linear-gradient(var(--text), var(--text)) top left / 1px 12px no-repeat,
        linear-gradient(var(--text), var(--text)) top right / 12px 1px no-repeat,
        linear-gradient(var(--text), var(--text)) top right / 1px 12px no-repeat,
        linear-gradient(var(--line), var(--line)) bottom left / 12px 1px no-repeat,
        linear-gradient(var(--line), var(--line)) bottom left / 1px 12px no-repeat,
        linear-gradient(var(--line), var(--line)) bottom right / 12px 1px no-repeat,
        linear-gradient(var(--line), var(--line)) bottom right / 1px 12px no-repeat;
    }
    .mark-name {
      font-size: 1.25rem;
      letter-spacing: 0.42em;
      text-shadow: 0 0 12px rgba(232, 232, 234, 0.28);
      padding-left: 2px;
    }
    .mark-sub {
      margin-top: 6px;
      color: var(--dim);
      font-size: 0.68rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
    }
    .mark-ticks {
      margin-top: 12px;
      height: 7px;
      background: repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 7px);
    }

    .sec {
      margin: 0.85em 0 0.25em;
      color: var(--dim);
      font-size: 0.68rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
    }
    .block { margin: 0 0 0.3em; }
    .ln {
      min-height: 1.45em;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .echo {
      margin: 0.75em 0 0.12em;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .echo:first-child { margin-top: 0; }
    .ps { white-space: nowrap; }
    .err { color: var(--error); }

    a.lk {
      color: inherit;
      text-underline-offset: 2px;
    }
    a.lk:focus {
      outline: 1px solid var(--text);
      outline-offset: 2px;
    }

    .plist {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin: 0.15rem 0 0.4rem;
    }
    .phead { display: none; }
    .prow {
      display: flex;
      flex-direction: column;
      gap: 0.05rem;
      min-width: 0;
    }
    .pname { overflow-wrap: anywhere; }
    .pclass, .pstate {
      color: var(--dim);
      padding-left: 0.8rem;
      overflow-wrap: anywhere;
    }

    @media (min-width: 700px) {
      .plist {
        display: grid;
        grid-template-columns: minmax(12ch, 20ch) minmax(0, 1fr) 6ch;
        column-gap: 1.2rem;
        row-gap: 0.18rem;
      }
      .phead, .prow { display: contents; }
      .phead .pname,
      .phead .pclass,
      .phead .pstate { color: var(--dim); }
      .pclass, .pstate { padding-left: 0; color: inherit; }
    }

    #pline {
      display: flex;
      align-items: flex-start;
      gap: 0.55rem;
      margin: 0.75em 0 0;
      position: relative;
    }
    #pline .ps { flex: 0 0 auto; padding-top: 0; line-height: 1.45; }
    .live {
      flex: 1 1 auto;
      min-width: 0;
      position: relative;
      min-height: 1.45em;
    }
    #paint {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      pointer-events: none;
    }
    .cur {
      display: inline-block;
      width: 0.62ch;
      height: 1.05em;
      background: var(--text);
      vertical-align: -0.15em;
      margin-left: 1px;
      animation: cur 1.05s steps(1, end) infinite;
    }
    @keyframes cur {
      50% { background: transparent; }
    }
    .sel {
      background: var(--text);
      color: var(--bg);
    }
    html:not(.on) .cur { animation: none; background: var(--mute); }

    @media (prefers-reduced-motion: reduce) {
      .cur { animation: none; }
    }

    #in {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      min-height: 1.45em;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: transparent;
      caret-color: transparent;
      -webkit-text-fill-color: transparent;
      font: inherit;
      font-size: 16px;
      line-height: 1.45;
      appearance: none;
      -webkit-appearance: none;
      outline: none;
      resize: none;
      overflow: hidden;
    }

    @media (pointer: coarse) {
      #pline { min-height: 44px; align-items: center; }
      .live { min-height: 44px; }
      #in { min-height: 44px; }
    }

    #chips {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 7px 10px calc(8px);
      border-top: 1px solid var(--line);
      z-index: 3;
    }
    #app.kb #chips { display: none; }

    .chip {
      flex: 0 0 auto;
      min-height: 44px;
      min-width: 44px;
      padding: 0 12px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--dim);
      font: inherit;
      font-size: 12px;
      letter-spacing: 0.08em;
      touch-action: manipulation;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .chip:focus {
      outline: 1px solid var(--text);
      outline-offset: 2px;
      color: var(--text);
    }
    .chip:active { color: var(--text); background: #111114; }

    @media (min-width: 1024px) {
      #chips {
        position: absolute;
        top: 28px;
        right: 0;
        bottom: 0;
        width: 7rem;
        flex-direction: column;
        flex-wrap: nowrap;
        border-top: 0;
        border-left: 1px solid var(--line);
        opacity: 0.42;
        padding: 12px 8px;
      }
      #chips:hover,
      #chips:focus-within { opacity: 0.95; }
      #stream { padding-right: 7.4rem; }
      #app.kb #stream { padding-right: 14px; }
      .chip { width: 100%; font-size: 11px; letter-spacing: 0.14em; }
    }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    noscript {
      display: block;
      color: var(--error);
      margin: 0 0 0.8em;
    }

    ::selection {
      background: #3a3a40;
      color: #fff;
    }

    @media (max-height: 420px) {
      #stat { padding-top: 4px; padding-bottom: 4px; min-height: 22px; }
      #stream { padding-top: 8px; padding-bottom: 10px; }
      .mark { padding: 8px 8px 10px; margin-bottom: 8px; }
      .mark-name { font-size: 1.05rem; }
      #chips { padding-top: 4px; padding-bottom: 4px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="hud">
      <div class="c c-tl"></div>
      <div class="c c-tr"></div>
      <div class="c c-bl"></div>
      <div class="c c-br"></div>
      <div class="scan" aria-hidden="true"></div>
      <header id="stat">
        <span>KXZ0TN</span>
        <span class="opt">TERMINAL</span>
        <span>PUBLIC</span>
        <span id="clk">UTC --:--:--</span>
      </header>
      <div id="stream" role="log" aria-live="polite" aria-relevant="additions" aria-label="terminal stream">
        <div id="log">
          <noscript>kxz0tn terminal needs JavaScript.</noscript>
        </div>
        <form id="pline" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
          <label class="sr" for="in">command</label>
          <span class="ps" aria-hidden="true">kxz0tn:~$</span>
          <span class="live">
            <span id="paint"></span>
            <input id="in" name="c" type="text" inputmode="text" enterkeyhint="go" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="command">
          </span>
        </form>
      </div>
      <nav id="chips" aria-label="commands">
        <button type="button" class="chip" data-cmd="help">help</button>
        <button type="button" class="chip" data-cmd="ls">ls</button>
        <button type="button" class="chip" data-cmd="projects">projects</button>
        <button type="button" class="chip" data-cmd="whoami">whoami</button>
        <button type="button" class="chip" data-cmd="clear">clear</button>
      </nav>
    </div>
  </div>
  <script>
    (function () {
      "use strict";

      var app = document.getElementById("app");
      var stream = document.getElementById("stream");
      var log = document.getElementById("log");
      var form = document.getElementById("pline");
      var input = document.getElementById("in");
      var paint = document.getElementById("paint");
      var chips = document.getElementById("chips");
      var clk = document.getElementById("clk");
      var PROMPT = "kxz0tn:~$ ";

      var FILES = ["ident", "motd", "projects", "log", "contact"];
      var COMMANDS = ["help", "whoami", "ls", "projects", "cat", "open", "status", "time", "contact", "clear"];
      var LS_NEXT = ["projects"];

      var PROJECTS = [
        { name: "zortex", klass: "inertial space survival", state: "LIVE", url: "https://kxz0tn.github.io/Zortex/" },
        { name: "hyperspace-portal", klass: "wormhole control deck", state: "LIVE", url: "https://kxz0tn.github.io/Hyperspace-portal/" },
        { name: "cipher", klass: "arena sport", state: "LIVE", url: "https://github.com/kxz0tn/Cipher" },
        { name: "xenocoil", klass: "arcade core", state: "LIVE", url: "https://github.com/kxz0tn/Xenocoil" },
        { name: "void-runner", klass: "lunar survival", state: "LIVE", url: "https://kxz0tn.github.io/void-runner/" },
        { name: "basebreaker", klass: "endless runner", state: "LIVE", url: "https://kxz0tn.github.io/basebreaker/" },
        { name: "neural-forge", klass: "electronics lab", state: "BETA", url: "https://kxz0tn.github.io/neural-forge/" },
        { name: "aetheris", klass: "medical research", state: "BETA", url: "https://kxz0tn.github.io/aetheris/" },
        { name: "high-trace", klass: "moon / ISS sky instrument", state: "LIVE", url: "https://kxz0tn.github.io/high-trace/" }
      ];

      var PROJECT_NAMES = PROJECTS.map(function (p) { return p.name; });
      var OPEN_MAP = Object.create(null);

      PROJECTS.forEach(function (p, i) {
        var n = i + 1;
        registerOpen(p.name, p);
        registerOpen(p.name.replace(/-/g, ""), p);
        registerOpen(p.name.replace(/-/g, "_"), p);
        registerOpen(String(n), p);
        registerOpen((n < 10 ? "0" : "") + n, p);
      });
      registerOpen("hyperspace", OPEN_MAP["hyperspace-portal"]);
      registerOpen("portal", OPEN_MAP["hyperspace-portal"]);

      var history = [];
      var histIndex = 0;
      var draft = "";
      var restH = 0;
      var restW = 0;

      function registerOpen(key, project) {
        OPEN_MAP[key.toLowerCase()] = project;
      }

      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }

      function toEnd() {
        stream.scrollTop = stream.scrollHeight;
        form.scrollIntoView({ block: "end", inline: "nearest" });
      }

      function utcStamp() {
        return new Date().toISOString().slice(0, 19).replace("T", " ") + " UTC";
      }

      function utcHms() {
        return "UTC " + new Date().toISOString().slice(11, 19);
      }

      function tick() {
        clk.textContent = utcHms();
      }

      function paintLive() {
        var v = input.value;
        var s = input.selectionStart;
        var e = input.selectionEnd;
        if (s == null) s = v.length;
        if (e == null) e = s;
        if (s > e) { var tmp = s; s = e; e = tmp; }
        while (paint.firstChild) paint.removeChild(paint.firstChild);
        paint.appendChild(document.createTextNode(v.slice(0, s)));
        if (s === e) {
          paint.appendChild(el("span", "cur"));
          paint.appendChild(document.createTextNode(v.slice(e)));
        } else {
          paint.appendChild(el("span", "sel", v.slice(s, e)));
          paint.appendChild(document.createTextNode(v.slice(e)));
        }
      }

      function printText(text, cls) {
        var block = el("div", "block");
        String(text).split("\n").forEach(function (line) {
          block.appendChild(el("div", cls ? "ln " + cls : "ln", line));
        });
        log.appendChild(block);
        toEnd();
      }

      function echo(cmd) {
        var row = el("div", "echo");
        row.appendChild(el("span", "ps", PROMPT));
        row.appendChild(document.createTextNode(cmd));
        log.appendChild(row);
        toEnd();
      }

      function label(name) {
        log.appendChild(el("div", "sec", name));
      }

      function bootMark() {
        var mark = el("div", "mark");
        mark.appendChild(el("div", "mark-name", "KXZ0TN"));
        mark.appendChild(el("div", "mark-sub", "public terminal"));
        mark.appendChild(el("div", "mark-ticks"));
        log.appendChild(mark);
      }

      function identBody() {
        label("STREAM");
        printText("kxz0tn\nSpaceship! | Cross-universe travel");
      }

      function printContact() {
        label("LINK");
        var block = el("div", "block");
        block.appendChild(linkLine("x", "https://x.com/kxz0tn"));
        block.appendChild(linkLine("github", "https://github.com/kxz0tn"));
        log.appendChild(block);
        toEnd();
      }

      function linkLine(name, url) {
        var line = el("div", "ln");
        line.appendChild(document.createTextNode(name.padEnd(8)));
        var a = el("a", "lk", url);
        a.href = url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        line.appendChild(a);
        return line;
      }

      function printProjects() {
        label("INDEX");
        var list = el("div", "plist");
        var head = el("div", "phead");
        head.appendChild(el("div", "pname", "name"));
        head.appendChild(el("div", "pclass", "class"));
        head.appendChild(el("div", "pstate", "state"));
        list.appendChild(head);
        PROJECTS.forEach(function (p) {
          var row = el("div", "prow");
          row.appendChild(el("div", "pname", p.name));
          row.appendChild(el("div", "pclass", p.klass));
          row.appendChild(el("div", "pstate", p.state));
          list.appendChild(row);
        });
        var block = el("div", "block");
        block.appendChild(list);
        log.appendChild(block);
        toEnd();
      }

      function cmdHelp() {
        label("STREAM");
        printText(
          "help              commands\n" +
          "?                 commands\n" +
          "whoami            identity\n" +
          "ls                files\n" +
          "ls projects       project list\n" +
          "projects          project list\n" +
          "cat FILE          ident | motd | projects | log | contact\n" +
          "open NAME         open a project\n" +
          "status            utc\n" +
          "time              utc\n" +
          "contact           links\n" +
          "clear             wipe"
        );
      }

      function cmdLs(args) {
        if (!args.length) {
          label("INDEX");
          printText(FILES.join("\n"));
          return;
        }
        if (args[0].toLowerCase() === "projects") {
          printProjects();
          return;
        }
        printText("ls: " + args[0] + ": no such file", "err");
        printText("try ls or ls projects");
      }

      function cmdCat(args) {
        if (!args.length) {
          printText("usage: cat FILE", "err");
          printText("FILE is ident | motd | projects | log | contact");
          return;
        }
        switch (args[0].toLowerCase()) {
          case "ident":
            identBody();
            break;
          case "motd":
            label("STREAM");
            printText("Independent builder.\nGames. Simulations. Research pages.\nIf it needs neon, it does not belong here.");
            break;
          case "projects":
            printProjects();
            break;
          case "log":
            label("STREAM");
            printText("2026-08-29  high-trace public\n2026-08-30  high-trace rebuild");
            break;
          case "contact":
            printContact();
            break;
          default:
            printText("cat: " + args[0] + ": no such file", "err");
            printText("try ls");
        }
      }

      function cmdOpen(args) {
        if (!args.length) {
          printText("open: unknown target", "err");
          printText("try ls projects");
          return;
        }
        var project = OPEN_MAP[args[0].toLowerCase()];
        if (!project) {
          printText("open: unknown target", "err");
          printText("try ls projects");
          return;
        }
        printText("opening " + project.name);
        window.open(project.url, "_blank", "noopener,noreferrer");
      }

      function cmdClear() {
        while (log.firstChild) log.removeChild(log.firstChild);
        bootMark();
        toEnd();
      }

      function dispatch(cmd, args, typed) {
        switch (cmd) {
          case "help":
          case "?":
            cmdHelp();
            break;
          case "whoami":
            identBody();
            break;
          case "ls":
            cmdLs(args);
            break;
          case "projects":
            cmdLs(["projects"]);
            break;
          case "cat":
            cmdCat(args);
            break;
          case "open":
            cmdOpen(args);
            break;
          case "status":
            label("STREAM");
            printText("ok\n" + utcStamp());
            break;
          case "time":
            printText(utcStamp());
            break;
          case "contact":
            cmdCat(["contact"]);
            break;
          case "clear":
            cmdClear();
            break;
          default:
            printText((typed || cmd) + ": command not found", "err");
            printText("try help");
        }
      }

      function run(raw) {
        var text = String(raw).replace(/\r\n/g, "\n").split("\n")[0].replace(/\s+/g, " ").trim();
        if (!text) {
          echo("");
          return;
        }
        echo(text);
        if (!history.length || history[history.length - 1] !== text) history.push(text);
        histIndex = history.length;
        draft = "";
        var tokens = text.split(" ");
        dispatch(tokens[0].toLowerCase(), tokens.slice(1), tokens[0]);
      }

      function commonPrefix(items) {
        if (!items.length) return "";
        var prefix = items[0];
        var i;
        var j;
        for (i = 1; i < items.length; i++) {
          j = 0;
          while (j < prefix.length && j < items[i].length && prefix.charAt(j) === items[i].charAt(j)) j += 1;
          prefix = prefix.slice(0, j);
          if (!prefix) return "";
        }
        return prefix;
      }

      function complete() {
        var value = input.value;
        var trailing = /\s$/.test(value);
        var parts = value.trim() ? value.trim().split(/\s+/) : [];
        var pool = COMMANDS;
        var head = [];
        var token = "";

        if (parts.length === 0 || (parts.length === 1 && !trailing)) {
          pool = COMMANDS;
          token = parts[0] || "";
          head = [];
        } else {
          var lead = parts[0].toLowerCase();
          if (lead === "cat") pool = FILES;
          else if (lead === "open") pool = PROJECT_NAMES;
          else if (lead === "ls") pool = LS_NEXT;
          else return;
          head = [parts[0]];
          token = trailing ? "" : parts[parts.length - 1];
        }

        var lower = token.toLowerCase();
        var hits = pool.filter(function (item) {
          return item.slice(0, lower.length) === lower;
        });
        if (!hits.length) return;

        if (hits.length === 1) {
          input.value = head.concat([hits[0]]).join(" ") + " ";
        } else {
          var prefix = commonPrefix(hits);
          if (head.length) input.value = prefix ? head.concat([prefix]).join(" ") : head.join(" ") + " ";
          else input.value = prefix;
          printText(hits.join("  "));
        }
        input.setSelectionRange(input.value.length, input.value.length);
        paintLive();
      }

      function layout() {
        var vv = window.visualViewport;
        var height = vv ? vv.height : window.innerHeight;
        var width = vv ? vv.width : window.innerWidth;
        var top = vv ? vv.offsetTop : 0;
        if (document.activeElement !== input || Math.abs(width - restW) > 80) {
          restH = height;
          restW = width;
        }
        var kb = restH - height > 80;
        app.style.height = height + "px";
        app.style.top = top + "px";
        if (kb) app.classList.add("kb");
        else app.classList.remove("kb");
        toEnd();
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        run(input.value);
        input.value = "";
        histIndex = history.length;
        draft = "";
        paintLive();
        toEnd();
      });

      input.addEventListener("input", paintLive);
      input.addEventListener("keyup", paintLive);
      input.addEventListener("click", paintLive);
      input.addEventListener("select", paintLive);
      input.addEventListener("focus", function () {
        document.documentElement.classList.add("on");
        paintLive();
        toEnd();
      });
      input.addEventListener("blur", function () {
        document.documentElement.classList.remove("on");
        paintLive();
        window.setTimeout(layout, 80);
      });

      input.addEventListener("keydown", function (e) {
        if (e.isComposing) return;
        if (e.key === "Tab") {
          e.preventDefault();
          complete();
          return;
        }
        if (e.key === "ArrowUp") {
          e.preventDefault();
          if (!history.length) return;
          if (histIndex === history.length) draft = input.value;
          if (histIndex > 0) histIndex -= 1;
          input.value = history[histIndex];
          input.setSelectionRange(input.value.length, input.value.length);
          paintLive();
          return;
        }
        if (e.key === "ArrowDown") {
          e.preventDefault();
          if (histIndex < history.length) histIndex += 1;
          input.value = histIndex === history.length ? draft : history[histIndex];
          input.setSelectionRange(input.value.length, input.value.length);
          paintLive();
          return;
        }
        if (e.ctrlKey && !e.metaKey && !e.altKey && (e.key === "l" || e.key === "L")) {
          e.preventDefault();
          cmdClear();
          input.value = "";
          paintLive();
        }
      });

      document.addEventListener("keydown", function (e) {
        if (e.isComposing) return;
        if (e.ctrlKey && !e.metaKey && !e.altKey && (e.key === "l" || e.key === "L")) {
          if (e.target === input) return;
          e.preventDefault();
          cmdClear();
          input.value = "";
          paintLive();
        }
      });

      chips.addEventListener("click", function (e) {
        var btn = e.target.closest("button[data-cmd]");
        if (!btn) return;
        run(btn.getAttribute("data-cmd"));
        input.value = "";
        paintLive();
        input.focus({ preventScroll: true });
        toEnd();
      });

      document.addEventListener("click", function (e) {
        if (e.target.closest("a, button")) return;
        var sel = window.getSelection();
        if (sel && String(sel) !== "") return;
        input.focus({ preventScroll: true });
      });

      window.addEventListener("resize", layout);
      window.addEventListener("orientationchange", function () {
        window.setTimeout(layout, 200);
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", layout);
        window.visualViewport.addEventListener("scroll", layout);
      }

      tick();
      window.setInterval(tick, 1000);
      bootMark();
      printText("ready\ntype help");
      paintLive();
      layout();
      restH = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      restW = window.visualViewport ? window.visualViewport.width : window.innerWidth;
      input.focus({ preventScroll: true });
    })();
  </script>
</body>
</html>
