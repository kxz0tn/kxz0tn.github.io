<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#050506">
  <meta name="description" content="kxz0tn terminal">
  <title>kxz0tn</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23050506'/%3E%3Cpath fill='none' stroke='%23e8e8ea' stroke-width='1' d='M2 5V2h3M11 2h3v3M14 11v3h-3M5 14H2v-3'/%3E%3Crect x='7' y='7' width='2' height='2' fill='%23e8e8ea'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #050506;
      --panel: #08080a;
      --line: #222226;
      --text: #e8e8ea;
      --dim: #7a7a82;
      --mute: #3a3a40;
      --error: #a0a0a6;
      --font: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      overscroll-behavior: none;
      font-family: var(--font);
      font-size: 15.5px;
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    #app {
      position: fixed;
      inset: 0;
      height: 100%;
      height: 100svh;
      height: 100dvh;
      padding: max(6px, env(safe-area-inset-top, 0px)) max(6px, env(safe-area-inset-right, 0px)) max(6px, env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px));
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse at 50% 40%, transparent 30%, rgba(0,0,0,0.65) 100%);
      overflow: hidden;
    }

    #hud {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      background: var(--panel);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .scan {
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: 4;
      opacity: 0.03;
      background: repeating-linear-gradient(to bottom, transparent 0 2px, #000 2px 3px);
    }

    .c {
      position: absolute;
      width: 10px;
      height: 10px;
      z-index: 6;
      pointer-events: none;
    }
    .c-tl { top: -1px; left: -1px; border-top: 1px solid var(--text); border-left: 1px solid var(--text); }
    .c-tr { top: -1px; right: -1px; border-top: 1px solid var(--text); border-right: 1px solid var(--text); }
    .c-bl { bottom: -1px; left: -1px; border-bottom: 1px solid var(--text); border-left: 1px solid var(--text); }
    .c-br { bottom: -1px; right: -1px; border-bottom: 1px solid var(--text); border-right: 1px solid var(--text); }

    #stat {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 8px 14px 7px;
      border-bottom: 1px solid var(--line);
      color: var(--dim);
      font-size: 10.5px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      min-height: 30px;
    }
    #stat span { white-space: nowrap; }
    #clk {
      color: var(--text);
      letter-spacing: 0.06em;
      font-variant-numeric: tabular-nums;
    }
    @media (max-width: 520px) {
      .opt { display: none; }
      #stat { letter-spacing: 0.12em; font-size: 10px; padding: 6px 10px; }
    }

    #stream {
      flex: 1 1 auto;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 16px 16px 20px;
      scrollbar-color: var(--mute) transparent;
    }

    #log { min-width: 0; }

    .mark {
      margin: 0 0 18px;
      padding: 0;
    }
    .mark-name {
      font-size: 1.1rem;
      letter-spacing: 0.48em;
      font-weight: 500;
      color: var(--text);
    }
    .mark-sub {
      margin-top: 4px;
      color: var(--dim);
      font-size: 0.65rem;
      letter-spacing: 0.36em;
      text-transform: uppercase;
    }
    .mark-ticks {
      margin-top: 10px;
      height: 1px;
      background: linear-gradient(90deg, var(--line), transparent 60%);
    }

    .sec {
      margin: 1.1em 0 0.35em;
      color: var(--dim);
      font-size: 0.62rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }
    .block { margin: 0 0 0.25em; }
    .ln {
      min-height: 1.5em;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .echo {
      margin: 0.9em 0 0.1em;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .echo:first-child { margin-top: 0; }
    .ps { color: var(--dim); white-space: nowrap; }
    .err { color: var(--error); }

    a.lk {
      color: inherit;
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
    }
    a.lk:focus {
      outline: 1px solid var(--text);
      outline-offset: 2px;
    }

    .plist {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      margin: 0.1rem 0 0.3rem;
    }
    .phead { display: none; }
    .prow {
      display: flex;
      flex-direction: column;
      gap: 0.02rem;
      min-width: 0;
    }
    .pname { overflow-wrap: anywhere; }
    .pclass, .pstate {
      color: var(--dim);
      padding-left: 0.6rem;
      overflow-wrap: anywhere;
      font-size: 0.92em;
    }

    .hlist {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      column-gap: 1.4em;
      row-gap: 0.22rem;
      align-items: start;
      margin: 0.1rem 0 0.3rem;
    }
    .hrow { display: contents; }
    .hcmd { white-space: nowrap; }
    .hdesc {
      min-width: 0;
      overflow-wrap: anywhere;
      word-break: normal;
      color: var(--dim);
    }

    .clist {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin: 0.1rem 0 0.3rem;
    }
    .crow {
      display: flex;
      flex-direction: column;
      gap: 0.02rem;
      min-width: 0;
    }
    .cname { white-space: nowrap; }
    .curl {
      color: var(--dim);
      padding-left: 0.6rem;
      overflow-wrap: anywhere;
      word-break: normal;
      font-size: 0.92em;
    }

    @media (min-width: 700px) {
      .plist {
        display: grid;
        grid-template-columns: minmax(14ch, 22ch) minmax(0, 1fr) 6ch;
        column-gap: 1.4rem;
        row-gap: 0.2rem;
      }
      .phead, .prow { display: contents; }
      .phead .pname,
      .phead .pclass,
      .phead .pstate { color: var(--dim); font-size: 0.75rem; letter-spacing: 0.08em; }
      .pclass, .pstate { padding-left: 0; color: inherit; font-size: 1em; }

      .clist {
        display: grid;
        grid-template-columns: 8ch minmax(0, 1fr);
        column-gap: 1.4rem;
        row-gap: 0.2rem;
      }
      .crow { display: contents; }
      .curl { padding-left: 0; color: inherit; font-size: 1em; }
    }

    #pline {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 0;
      margin: 0.9em 0 0;
      position: relative;
    }
    #pline .ps,
    #typed {
      font-family: inherit;
      font-size: inherit;
      line-height: 1.5;
      letter-spacing: inherit;
    }
    #pline .ps {
      flex: 0 0 auto;
      white-space: pre;
    }
    #typed {
      flex: 0 1 auto;
      min-width: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      pointer-events: none;
    }
    .cur {
      display: inline-block;
      width: 0.5em;
      height: 0.95em;
      background: currentColor;
      flex: 0 0 auto;
      align-self: center;
      animation: cur 1.1s steps(1, end) infinite;
    }
    @keyframes cur {
      50% { opacity: 0; }
    }
    .sel {
      background: var(--text);
      color: var(--bg);
    }
    html:not(.on) .cur { animation: none; opacity: 1; background: var(--mute); }

    @media (prefers-reduced-motion: reduce) {
      .cur { animation: none; }
    }

    #in {
      position: absolute;
      left: 0;
      top: 0;
      width: 1px;
      height: 1px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      opacity: 0;
      background: transparent;
      color: transparent;
      caret-color: transparent;
      -webkit-text-fill-color: transparent;
      font: inherit;
      font-size: 16px;
      line-height: 1.5;
      appearance: none;
      -webkit-appearance: none;
      outline: none;
      resize: none;
      overflow: hidden;
    }

    @media (pointer: coarse) {
      #pline { min-height: 44px; }
    }

    #chips {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      padding: 6px 10px 7px;
      border-top: 1px solid var(--line);
      z-index: 3;
    }
    #app.kb #chips { display: none; }

    .chip {
      flex: 0 0 auto;
      min-height: 40px;
      min-width: 40px;
      padding: 0 11px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--dim);
      font: inherit;
      font-size: 11.5px;
      letter-spacing: 0.06em;
      touch-action: manipulation;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .chip:focus {
      outline: 1px solid var(--text);
      outline-offset: 2px;
      color: var(--text);
    }
    .chip:active { color: var(--text); background: #111114; }

    @media (min-width: 1024px) {
      #chips {
        position: absolute;
        top: 30px;
        right: 0;
        bottom: 0;
        width: 6.2rem;
        flex-direction: column;
        flex-wrap: nowrap;
        border-top: 0;
        border-left: 1px solid var(--line);
        opacity: 0.35;
        padding: 14px 8px;
      }
      #chips:hover,
      #chips:focus-within { opacity: 0.9; }
      #stream { padding-right: 6.6rem; }
      #app.kb #stream { padding-right: 16px; }
      .chip { width: 100%; font-size: 11px; letter-spacing: 0.1em; }
    }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    noscript {
      display: block;
      color: var(--error);
      margin: 0 0 0.8em;
    }

    ::selection {
      background: #3a3a40;
      color: #fff;
    }

    @media (max-height: 420px) {
      #stat { padding-top: 4px; padding-bottom: 4px; min-height: 22px; }
      #stream { padding-top: 10px; padding-bottom: 12px; }
      .mark { margin-bottom: 10px; }
      .mark-name { font-size: 1rem; }
      #chips { padding-top: 4px; padding-bottom: 4px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="hud">
      <div class="c c-tl"></div>
      <div class="c c-tr"></div>
      <div class="c c-bl"></div>
      <div class="c c-br"></div>
      <div class="scan" aria-hidden="true"></div>
      <header id="stat">
        <span>KXZ0TN</span>
        <span class="opt">TERMINAL</span>
        <span>PUBLIC</span>
        <span id="clk">UTC --:--:--</span>
      </header>
      <div id="stream" role="log" aria-live="polite" aria-relevant="additions" aria-label="terminal stream">
        <div id="log">
          <noscript>kxz0tn terminal needs JavaScript.</noscript>
        </div>
        <form id="pline" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
          <label class="sr" for="in">command</label>
          <span class="ps" aria-hidden="true">kxz0tn:~$ </span>
          <span id="typed"></span>
          <span id="cur" class="cur" aria-hidden="true"></span>
          <input id="in" name="c" type="text" inputmode="text" enterkeyhint="go" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="command">
        </form>
      </div>
      <nav id="chips" aria-label="commands">
        <button type="button" class="chip" data-cmd="help">help</button>
        <button type="button" class="chip" data-cmd="ls">ls</button>
        <button type="button" class="chip" data-cmd="projects">projects</button>
        <button type="button" class="chip" data-cmd="whoami">whoami</button>
        <button type="button" class="chip" data-cmd="clear">clear</button>
      </nav>
    </div>
  </div>
  <script>
    (function () {
      "use strict";

      var app = document.getElementById("app");
      var stream = document.getElementById("stream");
      var log = document.getElementById("log");
      var form = document.getElementById("pline");
      var input = document.getElementById("in");
      var typed = document.getElementById("typed");
      var chips = document.getElementById("chips");
      var clk = document.getElementById("clk");
      var PROMPT = "kxz0tn:~$ ";

      var FILES = ["ident", "motd", "projects", "log", "contact"];
      var COMMANDS = ["help", "whoami", "ls", "projects", "cat", "open", "status", "time", "contact", "clear"];

      var PROJECTS = [
        { name: "zortex", klass: "inertial space survival", state: "LIVE", url: "https://kxz0tn.github.io/Zortex/" },
        { name: "hyperspace-portal", klass: "wormhole control deck", state: "LIVE", url: "https://kxz0tn.github.io/Hyperspace-portal/" },
        { name: "cipher", klass: "arena sport", state: "LIVE", url: "https://github.com/kxz0tn/Cipher" },
        { name: "xenocoil", klass: "arcade core", state: "LIVE", url: "https://github.com/kxz0tn/Xenocoil" },
        { name: "void-runner", klass: "lunar survival", state: "LIVE", url: "https://kxz0tn.github.io/void-runner/" },
        { name: "basebreaker", klass: "endless runner", state: "LIVE", url: "https://kxz0tn.github.io/basebreaker/" },
        { name: "neural-forge", klass: "electronics lab", state: "BETA", url: "https://kxz0tn.github.io/neural-forge/" },
        { name: "aetheris", klass: "medical research", state: "BETA", url: "https://kxz0tn.github.io/aetheris/" },
        { name: "high-trace", klass: "moon / ISS instrument", state: "LIVE", url: "https://kxz0tn.github.io/high-trace/" },
        { name: "last-circuit", klass: "space lessons terminal", state: "LIVE", url: "https://kxz0tn.github.io/last-circuit/" },
        { name: "dock-terminal", klass: "public command berth", state: "LIVE", url: "https://kxz0tn.github.io/dock-terminal/" }
      ];

      var PROJECT_NAMES = PROJECTS.map(function (p) { return p.name; });
      var OPEN_MAP = Object.create(null);

      PROJECTS.forEach(function (p, i) {
        var n = i + 1;
        registerOpen(p.name, p);
        registerOpen(p.name.replace(/-/g, ""), p);
        registerOpen(p.name.replace(/-/g, "_"), p);
        registerOpen(String(n), p);
        registerOpen((n < 10 ? "0" : "") + n, p);
      });
      registerOpen("hyperspace", OPEN_MAP["hyperspace-portal"]);
      registerOpen("portal", OPEN_MAP["hyperspace-portal"]);
      registerOpen("lastcircuit", OPEN_MAP["last-circuit"]);
      registerOpen("dock", OPEN_MAP["dock-terminal"]);

      var history = [];
      var histIndex = 0;
      var draft = "";
      var restH = 0;
      var restW = 0;

      function registerOpen(key, project) {
        if (project) OPEN_MAP[key.toLowerCase()] = project;
      }

      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }

      function toEnd() {
        stream.scrollTop = stream.scrollHeight;
        form.scrollIntoView({ block: "end", inline: "nearest" });
      }

      function utcStamp() {
        return new Date().toISOString().slice(0, 19).replace("T", " ") + " UTC";
      }

      function utcHms() {
        return "UTC " + new Date().toISOString().slice(11, 19);
      }

      function tick() {
        clk.textContent = utcHms();
      }

      function paintLive() {
        var v = input.value;
        var s = input.selectionStart;
        var e = input.selectionEnd;
        if (s == null) s = v.length;
        if (e == null) e = s;
        if (s > e) { var tmp = s; s = e; e = tmp; }
        while (typed.firstChild) typed.removeChild(typed.firstChild);
        typed.appendChild(document.createTextNode(v.slice(0, s)));
        if (s !== e) typed.appendChild(el("span", "sel", v.slice(s, e)));
        typed.appendChild(document.createTextNode(v.slice(e)));
      }

      function printText(text, cls) {
        var block = el("div", "block");
        String(text).split("\n").forEach(function (line) {
          block.appendChild(el("div", cls ? "ln " + cls : "ln", line));
        });
        log.appendChild(block);
        toEnd();
      }

      function echo(cmd) {
        var row = el("div", "echo");
        row.appendChild(el("span", "ps", PROMPT));
        row.appendChild(document.createTextNode(cmd));
        log.appendChild(row);
        toEnd();
      }

      function label(name) {
        log.appendChild(el("div", "sec", name));
      }

      function bootMark() {
        var mark = el("div", "mark");
        mark.appendChild(el("div", "mark-name", "KXZ0TN"));
        mark.appendChild(el("div", "mark-sub", "public terminal"));
        mark.appendChild(el("div", "mark-ticks"));
        log.appendChild(mark);
      }

      function identBody() {
        label("STREAM");
        printText("kxz0tn\nSpaceship! | Cross-universe travel");
      }

      function printContact() {
        label("LINK");
        var list = el("div", "clist");
        list.appendChild(contactRow("x", "https://x.com/kxz0tn"));
        list.appendChild(contactRow("github", "https://github.com/kxz0tn"));
        var block = el("div", "block");
        block.appendChild(list);
        log.appendChild(block);
        toEnd();
      }

      function contactRow(name, url) {
        var row = el("div", "crow");
        row.appendChild(el("div", "cname", name));
        var a = el("a", "lk curl", url);
        a.href = url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        row.appendChild(a);
        return row;
      }

      function printProjects() {
        label("INDEX");
        var list = el("div", "plist");
        var head = el("div", "phead");
        head.appendChild(el("div", "pname", "name"));
        head.appendChild(el("div", "pclass", "class"));
        head.appendChild(el("div", "pstate", "state"));
        list.appendChild(head);
        PROJECTS.forEach(function (p) {
          var row = el("div", "prow");
          row.appendChild(el("div", "pname", p.name));
          row.appendChild(el("div", "pclass", p.klass));
          row.appendChild(el("div", "pstate", p.state));
          list.appendChild(row);
        });
        var block = el("div", "block");
        block.appendChild(list);
        log.appendChild(block);
        toEnd();
      }

      function cmdHelp() {
        label("COMMANDS");
        var list = el("div", "hlist");
        function hrow(cmd, desc) {
          var row = el("div", "hrow");
          row.appendChild(el("div", "hcmd", cmd));
          row.appendChild(el("div", "hdesc", desc));
          list.appendChild(row);
        }
        hrow("help", "this list");
        hrow("whoami", "identity");
        hrow("ls", "files");
        hrow("ls projects", "project index");
        hrow("projects", "same as ls projects");
        hrow("cat FILE", "ident | motd | projects | log | contact");
        hrow("open NAME", "launch a project");
        hrow("status", "node state");
        hrow("time", "UTC stamp");
        hrow("contact", "links");
        hrow("clear", "reset stream");
        var block = el("div", "block");
        block.appendChild(list);
        log.appendChild(block);
        toEnd();
      }

      function cmdLs(args) {
        if (!args.length) {
          printText(FILES.join("\n"));
          return;
        }
        if (args[0].toLowerCase() === "projects") {
          printProjects();
          return;
        }
        printText("ls: " + args[0] + ": no such file", "err");
        printText("try ls or ls projects");
      }

      function cmdCat(args) {
        if (!args.length) {
          printText("usage: cat FILE", "err");
          printText("FILE is ident | motd | projects | log | contact");
          return;
        }
        switch (args[0].toLowerCase()) {
          case "ident":
            identBody();
            break;
          case "motd":
            printText("Independent builder.\nGames. Simulations. Research pages.\nIf it needs neon, it does not belong here.");
            break;
          case "projects":
            printProjects();
            break;
          case "log":
            printText("2026-08-29  high-trace public\n2026-08-30  high-trace rebuild\n2026-10-12  terminal refresh — last-circuit, dock-terminal added");
            break;
          case "contact":
            printContact();
            break;
          default:
            printText("cat: " + args[0] + ": no such file", "err");
            printText("try ls");
        }
      }

      function cmdOpen(args) {
        if (!args.length) {
          printText("open: unknown target", "err");
          printText("try ls projects");
          return;
        }
        var project = OPEN_MAP[args[0].toLowerCase()];
        if (!project) {
          printText("open: unknown target", "err");
          printText("try ls projects");
          return;
        }
        printText("opening " + project.name);
        window.open(project.url, "_blank", "noopener,noreferrer");
      }

      function cmdClear() {
        while (log.firstChild) log.removeChild(log.firstChild);
        bootMark();
        toEnd();
      }

      function dispatch(cmd, args, typedCmd) {
        switch (cmd) {
          case "help":
          case "?":
            cmdHelp();
            break;
          case "whoami":
            identBody();
            break;
          case "ls":
            cmdLs(args);
            break;
          case "projects":
            cmdLs(["projects"]);
            break;
          case "cat":
            cmdCat(args);
            break;
          case "open":
            cmdOpen(args);
            break;
          case "status":
            label("STREAM");
            printText("ok\n" + utcStamp());
            break;
          case "time":
            printText(utcStamp());
            break;
          case "contact":
            cmdCat(["contact"]);
            break;
          case "clear":
            cmdClear();
            break;
          default:
            printText((typedCmd || cmd) + ": command not found", "err");
            printText("try help");
        }
      }

      function run(raw) {
        var text = String(raw).replace(/\r\n/g, "\n").split("\n")[0].replace(/\s+/g, " ").trim();
        if (!text) {
          echo("");
          return;
        }
        echo(text);
        if (!history.length || history[history.length - 1] !== text) history.push(text);
        histIndex = history.length;
        draft = "";
        var tokens = text.split(" ");
        dispatch(tokens[0].toLowerCase(), tokens.slice(1), tokens[0]);
      }

      function commonPrefix(items) {
        if (!items.length) return "";
        var prefix = items[0];
        var i, j;
        for (i = 1; i < items.length; i++) {
          for (j = 0; j < prefix.length && j < items[i].length; j++) {
            if (prefix.charAt(j) !== items[i].charAt(j)) break;
          }
          prefix = prefix.slice(0, j);
          if (!prefix) break;
        }
        return prefix;
      }

      function tabComplete() {
        var v = input.value;
        var pos = input.selectionStart == null ? v.length : input.selectionStart;
        var before = v.slice(0, pos);
        var after = v.slice(pos);
        var parts = before.split(" ");
        var last = parts[parts.length - 1];
        var lead = parts.length > 1 ? parts[0].toLowerCase() : "";
        var pool = [];
        if (lead === "cat") pool = FILES;
        else if (lead === "open") pool = PROJECT_NAMES.concat(Object.keys(OPEN_MAP));
        else if (lead === "ls") pool = ["projects"].concat(FILES);
        else if (!lead) pool = COMMANDS;
        else pool = COMMANDS;
        var hits = [];
        var low = last.toLowerCase();
        pool.forEach(function (item) {
          if (item.toLowerCase().indexOf(low) === 0) hits.push(item);
        });
        hits = hits.filter(function (v, i, a) { return a.indexOf(v) === i; });
        if (!hits.length) return;
        if (hits.length === 1) {
          parts[parts.length - 1] = hits[0];
          var next = parts.join(" ") + (lead ? " " : "") + after;
          input.value = next;
          input.setSelectionRange(parts.join(" ").length + (lead ? 1 : 0), parts.join(" ").length + (lead ? 1 : 0));
        } else {
          var pref = commonPrefix(hits);
          if (pref.length > last.length) {
            parts[parts.length - 1] = pref;
            input.value = parts.join(" ") + after;
            input.setSelectionRange(parts.join(" ").length, parts.join(" ").length);
          } else {
            printText(hits.join("  "));
          }
        }
        paintLive();
      }

      function layout() {
        var vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        var vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
        var keyboard = restH > 0 && vh < restH * 0.75 && vw > 300;
        if (keyboard) app.classList.add("kb");
        else app.classList.remove("kb");
        if (!keyboard && vh > 0) {
          restH = vh;
          restW = vw;
        }
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        run(input.value);
        input.value = "";
        paintLive();
        toEnd();
      });

      input.addEventListener("input", paintLive);
      input.addEventListener("select", paintLive);
      input.addEventListener("keydown", function (e) {
        if (e.isComposing) return;
        if (e.key === "Tab") {
          e.preventDefault();
          tabComplete();
          return;
        }
        if (e.key === "ArrowUp") {
          e.preventDefault();
          if (!history.length) return;
          if (histIndex === history.length) draft = input.value;
          if (histIndex > 0) histIndex -= 1;
          input.value = history[histIndex];
          input.setSelectionRange(input.value.length, input.value.length);
          paintLive();
          return;
        }
        if (e.key === "ArrowDown") {
          e.preventDefault();
          if (histIndex < history.length) histIndex += 1;
          input.value = histIndex === history.length ? draft : history[histIndex];
          input.setSelectionRange(input.value.length, input.value.length);
          paintLive();
          return;
        }
        if (e.ctrlKey && !e.metaKey && !e.altKey && (e.key === "l" || e.key === "L")) {
          e.preventDefault();
          cmdClear();
          input.value = "";
          paintLive();
        }
      });

      document.addEventListener("keydown", function (e) {
        if (e.isComposing) return;
        if (e.ctrlKey && !e.metaKey && !e.altKey && (e.key === "l" || e.key === "L")) {
          if (e.target === input) return;
          e.preventDefault();
          cmdClear();
          input.value = "";
          paintLive();
        }
      });

      chips.addEventListener("click", function (e) {
        var btn = e.target.closest("button[data-cmd]");
        if (!btn) return;
        run(btn.getAttribute("data-cmd"));
        input.value = "";
        paintLive();
        input.focus({ preventScroll: true });
        toEnd();
      });

      document.addEventListener("click", function (e) {
        if (e.target.closest("a, button")) return;
        var sel = window.getSelection();
        if (sel && String(sel) !== "") return;
        input.focus({ preventScroll: true });
      });

      window.addEventListener("resize", layout);
      window.addEventListener("orientationchange", function () {
        window.setTimeout(layout, 200);
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", layout);
        window.visualViewport.addEventListener("scroll", layout);
      }

      tick();
      window.setInterval(tick, 1000);
      bootMark();
      printText("ready\ntype help");
      paintLive();
      layout();
      restH = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      restW = window.visualViewport ? window.visualViewport.width : window.innerWidth;
      input.focus({ preventScroll: true });
    })();
  </script>
</body>
</html>
